<!DOCTYPE html>
<html>
<head>
    <title>Employee Attrition Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            text-align: center;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="header">
    <h1>Employee Attrition Prediction</h1>
    <p>Machine Learning Based Prediction System</p>
</div>

<div class="container">

<form action="/predict" method="POST">


<label>Age</label>
<input type="number" name="Age" required>


<label>Business Travel</label>
<select name="BusinessTravel">
<option value="Travel_Rarely">Travel Rarely</option>
<option value="Travel_Frequently">Travel Frequently</option>
<option value="Non-Travel">Non Travel</option>
</select>


<label>Daily Rate</label>
<input type="number" name="DailyRate" required>


<label>Department</label>
<select name="Department">
<option value="Sales">Sales</option>
<option value="Research & Development">Research & Development</option>
<option value="Human Resources">Human Resources</option>
</select>


<label>Distance From Home</label>
<input type="number" name="DistanceFromHome" required>


<label>Education</label>
<input type="number" name="Education" required>


<label>Education Field</label>
<select name="EducationField">
<option value="Life Sciences">Life Sciences</option>
<option value="Medical">Medical</option>
<option value="Marketing">Marketing</option>
<option value="Technical Degree">Technical Degree</option>
<option value="Other">Other</option>
<option value="Human Resources">Human Resources</option>
</select>


<label>Employee Number</label>
<input type="number" name="EmployeeNumber" required>


<label>Environment Satisfaction</label>
<input type="number" name="EnvironmentSatisfaction" required>


<label>Gender</label>
<select name="Gender">
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>
<label>Hourly Rate</label>
<input type="number" name="HourlyRate" required>


<label>Job Involvement</label>
<input type="number" name="JobInvolvement" required>


<label>Job Level</label>
<input type="number" name="JobLevel" required>


<label>Job Role</label>
<select name="JobRole">
<option value="Healthcare Representative">Healthcare Representative</option>
<option value="Human Resources">Human Resources</option>
<option value="Laboratory Technician">Laboratory Technician</option>
<option value="Manager">Manager</option>
<option value="Manufacturing Director">Manufacturing Director</option>
<option value="Research Director">Research Director</option>
<option value="Research Scientist">Research Scientist</option>
<option value="Sales Executive">Sales Executive</option>
<option value="Sales Representative">Sales Representative</option>
</select>


<label>Job Satisfaction</label>
<input type="number" name="JobSatisfaction" required>


<label>Marital Status</label>
<select name="MaritalStatus">
<option value="Single">Single</option>
<option value="Married">Married</option>
<option value="Divorced">Divorced</option>
</select>


<label>Monthly Income</label>
<input type="number" name="MonthlyIncome" required>


<label>Monthly Rate</label>
<input type="number" name="MonthlyRate" required>


<label>Num Companies Worked</label>
<input type="number" name="NumCompaniesWorked" required>


<label>Over Time</label>
<select name="OverTime">
<option value="Yes">Yes</option>
<option value="No">No</option>
</select>


<label>Percent Salary Hike</label>
<input type="number" name="PercentSalaryHike" required>


<label>Performance Rating</label>
<input type="number" name="PerformanceRating" required>


<label>Relationship Satisfaction</label>
<input type="number" name="RelationshipSatisfaction" required>


<label>Stock Option Level</label>
<input type="number" name="StockOptionLevel" required>


<label>Total Working Years</label>
<input type="number" name="TotalWorkingYears" required>


<label>Training Times Last Year</label>
<input type="number" name="TrainingTimesLastYear" required>


<label>Work Life Balance</label>
<input type="number" name="WorkLifeBalance" required>


<label>Years At Company</label>
<input type="number" name="YearsAtCompany" required>


<label>Years In Current Role</label>
<input type="number" name="YearsInCurrentRole" required>


<label>Years Since Last Promotion</label>
<input type="number" name="YearsSinceLastPromotion" required>


<label>Years With Current Manager</label>
<input type="number" name="YearsWithCurrManager" required>


<button type="submit">
Predict Attrition
</button>


</form>


{% if prediction %}
<div class="result">
{{ prediction }}
</div>
{% endif %}


</div>

</body>
</html>
