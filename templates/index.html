<!DOCTYPE html>
<html>
<head>
    <title>Employee Attrition Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="header">
    <h1>Employee Attrition Prediction</h1>
    <p>Machine Learning Based Prediction System</p>
</div>


<div class="container">

<form action="/predict" method="POST">

<label>Age</label>
<input type="number" name="Age" min="18" max="65" required>


<label>Business Travel</label>
<select name="BusinessTravel">
    <option value="Travel_Rarely">Travel Rarely</option>
    <option value="Travel_Frequently">Travel Frequently</option>
    <option value="Non-Travel">Non Travel</option>
</select>


<label>Daily Rate</label>
<input type="number" name="DailyRate" min="0" required>


<label>Department</label>
<select name="Department">
    <option value="Sales">Sales</option>
    <option value="Research & Development">Research & Development</option>
    <option value="Human Resources">Human Resources</option>
</select>


<label>Distance From Home</label>
<input type="number" name="DistanceFromHome" min="0" required>


<label>Education</label>
<input type="number" name="Education" min="1" max="5" required>


<label>Education Field</label>
<select name="EducationField">
    <option value="Life Sciences">Life Sciences</option>
    <option value="Medical">Medical</option>
    <option value="Marketing">Marketing</option>
    <option value="Technical Degree">Technical Degree</option>
    <option value="Other">Other</option>
    <option value="Human Resources">Human Resources</option>
</select>


<label>Employee Number</label>
<input type="number" name="EmployeeNumber" min="0" required>


<label>Environment Satisfaction</label>
<input type="number" name="EnvironmentSatisfaction" min="1" max="4" required>


<label>Gender</label>
<select name="Gender">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>


<label>Hourly Rate</label>
<input type="number" name="HourlyRate" min="0" required>


<label>Job Involvement</label>
<input type="number" name="JobInvolvement" min="1" max="4" required>


<label>Job Level</label>
<input type="number" name="JobLevel" min="1" max="5" required>


<label>Job Role</label>
<select name="JobRole">
<option value="Healthcare Representative">Healthcare Representative</option>
<option value="Human Resources">Human Resources</option>
<option value="Laboratory Technician">Laboratory Technician</option>
<option value="Manager">Manager</option>
<option value="Manufacturing Director">Manufacturing Director</option>
<option value="Research Director">Research Director</option>
<option value="Research Scientist">Research Scientist</option>
<option value="Sales Executive">Sales Executive</option>
<option value="Sales Representative">Sales Representative</option>
</select>


<label>Job Satisfaction</label>
<input type="number" name="JobSatisfaction" min="1" max="4" required>


<label>Marital Status</label>
<select name="MaritalStatus">
<option value="Single">Single</option>
<option value="Married">Married</option>
<option value="Divorced">Divorced</option>
</select>


<label>Monthly Income</label>
<input type="number" name="MonthlyIncome" min="0" required>


<label>Monthly Rate</label>
<input type="number" name="MonthlyRate" min="0" required>


<label>Num Companies Worked</label>
<input type="number" name="NumCompaniesWorked" min="0" required>


<label>Over Time</label>
<select name="OverTime">
<option value="Yes">Yes</option>
<option value="No">No</option>
</select>


<label>Percent Salary Hike</label>
<input type="number" name="PercentSalaryHike" min="0" required>


<label>Performance Rating</label>
<input type="number" name="PerformanceRating" min="1" max="5" required>


<label>Relationship Satisfaction</label>
<input type="number" name="RelationshipSatisfaction" min="1" max="4" required>


<label>Stock Option Level</label>
<input type="number" name="StockOptionLevel" min="0" required>


<label>Total Working Years</label>
<input type="number" name="TotalWorkingYears" min="0" required>


<label>Training Times Last Year</label>
<input type="number" name="TrainingTimesLastYear" min="0" required>


<label>Work Life Balance</label>
<input type="number" name="WorkLifeBalance" min="1" max="4" required>


<label>Years At Company</label>
<input type="number" name="YearsAtCompany" min="0" required>


<label>Years In Current Role</label>
<input type="number" name="YearsInCurrentRole" min="0" required>


<label>Years Since Last Promotion</label>
<input type="number" name="YearsSinceLastPromotion" min="0" required>


<label>Years With Current Manager</label>
<input type="number" name="YearsWithCurrManager" min="0" required>


<button type="submit">
Predict Attrition
</button>


</form>


{% if prediction %}
<div class="result">
{{ prediction }}
</div>
{% endif %}


</div>

</body>
</html>
